
services:
  # Redis Database Service
  redis:
    image: redis:7-alpine
    container_name: mensch-redis
    ports:
      - "6379:6379"
    restart: always

  # FastAPI Web Application Service
  web:
    build: .
    container_name: mensch-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-false}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORTEGHAL_API_URL=http://pocketbase:8090
      - PORTEGHAL_API_KEY=${PORTEGHAL_API_KEY}
    # Ensure the web app waits until the Redis container is up and running
    depends_on:
      - redis
    restart: always
